<rect width="1078" height="566" fill="#ffffff"/>
<text class="ttl" x="128.0" y="32">远征关卡02 · 破败旅馆 — 五层纵剖图（沿 x = 0，向东看）</text>
<text class="sub" x="128.0" y="52">整关是一个空间，五层上下叠放、层间隔 12 m，像 98F 与 99F 的关系；层间靠地板破洞贯通，不用楼梯。走廊沿南→北。</text>
<text class="sub" x="128.0" y="70">横轴 = 平面南北向（160 m，左南右北），切过「阳台 → 挑高前厅 → 长廊 → T 字横廊」这条主轴。</text>
<text class="sub" x="128.0" y="88">第 1 层挑高前厅通高 11.9 m；第 2–5 层没有挑高前厅，全层 3.0 m。</text>
<text class="sub" x="128.0" y="106">长廊两侧 10 间 + 两条支廊两侧 10 间，共 20 间客房垂直于本剖面（见单层平面图）。横轴最右段（y = −55…−100）只有两条 45 m 支廊，它们位于 x = ±20、垂直于本剖面，故此处留白。</text>
